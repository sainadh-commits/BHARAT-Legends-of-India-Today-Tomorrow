let _ctx = null;
function getCtx() {
  if (!_ctx) {
    try { _ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { _ctx = null; }
  }
  return _ctx;
}
function tone(freq, dur, type = "sine", vol = 0.16, delay = 0) {
  const ctx = getCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function useSfx(soundOn) {
  return {
    click: () => soundOn && tone(520, 0.06, "square", 0.07),
    correct: () => { if (!soundOn) return; tone(740, 0.12, "sine", 0.15); tone(988, 0.16, "sine", 0.13, 0.09); },
    wrong: () => soundOn && tone(160, 0.28, "sawtooth", 0.13),
    win: () => {
      if (!soundOn) return;
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "sine", 0.14, i * 0.11));
    },
    unlock: () => { if (!soundOn) return; tone(660, 0.1, "triangle", 0.14); tone(880, 0.18, "triangle", 0.13, 0.08); },
    tick: () => soundOn && tone(1000, 0.03, "square", 0.04),
    pop: () => soundOn && tone(700, 0.08, "sine", 0.08),
  };
}

/* Ask Bharat uses the OpenAI API for open-ended conversation. */
const CHAT_SYSTEM_PROMPT = `You are "Ask Bharat," the friendly in-app learning assistant for BHARAT: Legends of India, a website that teaches Indian history and culture through games, timelines, quizzes, and a region-by-region explorer.

Answer questions about Indian history, culture, geography, festivals, art, music, food, and related topics. Keep answers concise and easy to read for a curious learner of any age — usually two to four short paragraphs, or a short list, not an essay.

If someone asks about navigating the site, answer briefly based on its sections: Home, Games, History, Culture, Map, and Achievements.

Stick to well-established historical and cultural facts. If something is genuinely uncertain or contested among historians, say so briefly instead of presenting one view as settled.

If a question has nothing to do with India's history, culture, or this website, gently redirect the person back to those topics instead of answering it.`;

function localBharatAnswer(question, contextTopic = null) {
  const q = String(question || "").toLowerCase().trim();
  const topic = contextTopic ? (HISTORY_LEARNING[contextTopic.id] || null) : null;
  const topicName = contextTopic?.name || "Indian history and culture";
  let answer = "";
  if (/^(hi|hello|hey|namaste|namaskar)\b/.test(q)) {
    answer = `I’m Ask Bharat. Ask me about ${topic ? topicName : "Indian history, culture, geography, festivals, monuments, science, or this website"}.`;
  } else if (q.includes("website") || q.includes("navigate") || q.includes("how do i use")) {
    answer = "Explore History for detailed periods and notes, Games for quizzes and challenges, Culture for traditions and arts, Map for regional exploration, and Achievements for your progress.";
  } else if (topic) {
    if (q.includes("timeline") || q.includes("when") || q.includes("dates") || q.includes("chronology")) answer = `${topicName} timeline\n\n${topic.timeline.map((t) => `• ${t.year}: ${t.text}`).join("\n")}`;
    else if (q.includes("exam") || q.includes("notes") || q.includes("revision")) answer = `Exam notes — ${topicName}\n\n• Period: ${contextTopic.years}\n• Geography: ${topic.geography}\n• Important places: ${topic.places.join(", ")}\n• People: ${topic.people.join(", ")}\n• Key events: ${topic.events.join("; ")}\n• Importance: ${topic.importance}`;
    else if (q.includes("summary") || q.includes("summarize") || q.includes("short")) answer = topic.summary;
    else if (q.includes("society") || q.includes("daily life")) answer = topic.society;
    else if (q.includes("agriculture") || q.includes("economy")) answer = topic.agriculture;
    else if (q.includes("trade")) answer = topic.trade;
    else if (q.includes("religion") || q.includes("belief")) answer = topic.beliefs;
    else if (q.includes("art") || q.includes("culture") || q.includes("architecture")) answer = topic.art;
    else if (q.includes("science") || q.includes("technology") || q.includes("achievement")) answer = topic.science;
    else if (q.includes("evidence") || q.includes("archaeolog")) answer = topic.evidence;
    else if (q.includes("decline") || q.includes("fall") || q.includes("end") || q.includes("transformation")) answer = topic.transformation;
    else if (q.includes("geography") || q.includes("region") || q.includes("where")) answer = topic.geography;
    else if (q.includes("people") || q.includes("who")) answer = `Important people connected with ${topicName}: ${topic.people.join(", ")}.`;
    else if (q.includes("place") || q.includes("city") || q.includes("cities")) answer = `Important places connected with ${topicName}: ${topic.places.join(", ")}.`;
    else if (q.includes("event") || q.includes("important")) answer = `Key events include: ${topic.events.join("; ")}`;
    else answer = `${topic.summary}\n\nKey facts: ${topic.facts.join(" • ")}`;
  } else {
    const matched = PERIODS.map((p) => ({ p, text: `${p.name} ${p.years}`.toLowerCase() })).find(({ text }) => text.split(/\s+/).some((w) => w.length > 4 && q.includes(w)));
    if (matched) answer = HISTORY_LEARNING[matched.p.id]?.summary || matched.p.blurb;
    else if (q.includes("indus") || q.includes("harappa") || q.includes("mohenjo")) answer = HISTORY_LEARNING.indus.summary;
    else if (q.includes("ashoka") || q.includes("maurya")) answer = HISTORY_LEARNING.maurya.summary;
    else if (q.includes("aryabhata") || q.includes("gupta")) answer = HISTORY_LEARNING.gupta.summary;
    else if (q.includes("mughal") || q.includes("taj mahal")) answer = HISTORY_LEARNING.mughal.summary;
    else if (q.includes("gandhi") || q.includes("independence") || q.includes("colonial")) answer = HISTORY_LEARNING.colonial.summary;
    else answer = "I can answer questions about India’s history, culture, geography, festivals, monuments, science, and this website. For a fully open-ended AI conversation, add your OpenAI API key in Ask Bharat settings.";
  }
  return `Namaste! 🙏\n\n${answer}`;
}

async function askOpenAI(apiKey, messages, contextTopic, signal) {
  const topicContext = contextTopic
    ? `\n\nACTIVE HISTORY TOPIC: ${contextTopic.name} (${contextTopic.years}). Use this topic as context when relevant, but always answer the user's actual question.`
    : "";
  const system = `${CHAT_SYSTEM_PROMPT}\n\nYou are Ask Bharat, the AI learning assistant inside BHARAT: Legends of India. Answer the user's actual question, not a fixed canned response. Maintain conversation context across turns. You can answer general questions too. Be accurate, clear, and honest about uncertainty. Start every answer with exactly: "Namaste! 🙏"${topicContext}`;
  const input = [
    { role: "system", content: system },
    ...messages.map((m) => ({
      role: m.role === "assistant" ? "assistant" : "user",
      content: String(m.content || "")
    }))
  ];
  const res = await fetch("https://api.openai.com/v1/responses", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: "gpt-5.6-luna",
      input,
      max_output_tokens: 1400
    }),
    signal
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data?.error?.message || `OpenAI request failed (${res.status})`);
  const text = typeof data?.output_text === "string"
    ? data.output_text.trim()
    : Array.isArray(data?.output)
      ? data.output.flatMap((item) => Array.isArray(item?.content) ? item.content : []).filter((part) => part?.type === "output_text").map((part) => part.text || "").join("\n").trim()
      : "";
  if (!text) throw new Error("OpenAI returned an empty answer.");
  return /^Namaste!\s*🙏/i.test(text) ? text : `Namaste! 🙏\n\n${text}`;
}

/* Scroll-reveal wrapper: fades + slides an element up the first time it enters view. */
function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setShown(true);
      return;
    }
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setShown(true); obs.disconnect(); } },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className={className}
      style={{
        opacity: shown ? 1 : 0,
        transform: shown ? "translateY(0)" : "translateY(18px)",
        transition: `opacity 0.6s ease ${delay}s, transform 0.6s cubic-bezier(.2,.8,.2,1) ${delay}s`,
      }}>
      {children}
    </div>
  );
}

function QuizGame({ sfx, unlock, topicId = "indus", onHome, onGames, onNotes }) {
  const [diff, setDiff] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [i, setI] = useState(0);
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(3);
  const [picked, setPicked] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [timeLeft, setTimeLeft] = useState(0);
  const [done, setDone] = useState(false);
  const [used, setUsed] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem("bharat-quiz-used") || "{}"); } catch { return {}; }
  });
  const limits = { easy: 0, normal: 20, hard: 15 };
  const topic = PERIODS.find((p) => p.id === topicId) || PERIODS[0];
  const detail = HISTORY_DETAILS[topic.id];

  function saveUsed(next) {
    setUsed(next);
    try { sessionStorage.setItem("bharat-quiz-used", JSON.stringify(next)); } catch {}
  }
  useEffect(() => {
    try {
      const saved = JSON.parse(sessionStorage.getItem("bharat-quiz-active") || "null");
      if (saved && saved.topicId === topicId && saved.questions?.length) {
        setDiff(saved.diff || null);
        setQuestions(saved.questions || []);
        setI(saved.i || 0);
        setScore(saved.score || 0);
        setLives(saved.lives ?? 3);
        setPicked(saved.picked ?? null);
        setAnswers(saved.answers || []);
        setTimeLeft(saved.timeLeft || 0);
        setDone(saved.done || false);
      }
    } catch {}
  }, [topicId]);

  useEffect(() => {
    try {
      if (diff && questions.length) {
        sessionStorage.setItem("bharat-quiz-active", JSON.stringify({
          topicId, diff, questions, i, score, lives, picked, answers, timeLeft, done
        }));
      }
    } catch {}
  }, [topicId, diff, questions, i, score, lives, picked, answers, timeLeft, done]);

  function start(d) {
    try { sessionStorage.removeItem("bharat-quiz-active"); } catch {}
    const bank = TOPIC_QUIZZES[topic.id] || TOPIC_QUIZZES.indus;
    const key = `${topic.id}:${d}`;
    const already = used[key] || [];
    const fresh = bank.filter((q) => !already.includes(q.id));
    if (!fresh.length) {
      setQuestions([]);
      setDiff(d);
      setDone("exhausted");
      sfx.click();
      return;
    }
    const selected = shuffle(fresh).slice(0, Math.min(5, fresh.length));
    const nextUsed = { ...used, [key]: [...already, ...selected.map((q) => q.id)] };
    saveUsed(nextUsed);
    setDiff(d); setQuestions(selected); setI(0); setScore(0); setLives(3);
    setPicked(null); setAnswers([]); setDone(false); setTimeLeft(0);
    sfx.click();
  }

  useEffect(() => {
    if (!diff || done || picked !== null || !questions.length) return;
    const limit = limits[diff];
    if (!limit) return;
    setTimeLeft(limit);
    const id = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) { clearInterval(id); handleAnswer(-1); return 0; }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [diff, i, picked, done, questions]);

  function handleAnswer(idx) {
    if (picked !== null || !questions[i]) return;
    const q = questions[i];
    const correct = idx === q.a;
    const nextScore = score + (correct ? 1 : 0);
    setPicked(idx);
    setAnswers((prev) => [...prev, { q, selected: idx }]);
    if (correct) { setScore(nextScore); sfx.correct(); }
    else { sfx.wrong(); setLives((l) => l - 1); }

    setTimeout(() => {
      const outOfLives = !correct && lives - 1 <= 0 && diff !== "easy";
      if (i + 1 >= questions.length || outOfLives) {
        setScore(nextScore);
        setDone(true);
        sfx.win();
        unlock("ancientExplorer");
        if (diff === "hard" && nextScore / questions.length >= 0.8) unlock("historyMaster");
      } else {
        setI((n) => n + 1);
        setPicked(null);
      }
    }, 250);
  }

  function chooseAgain() {
    try { sessionStorage.removeItem("bharat-quiz-active"); } catch {}
    if (done === "exhausted") { setDone(false); setDiff(null); return; }
    setDone(false); setDiff(null); setQuestions([]); setAnswers([]);
  }

  if (!diff) {
    return (
      <div>
        <div className="flex items-center gap-2 mb-2">
          <BookOpen size={22} className="u-b-text-gold-bright" />
          <span className="font-body text-xs uppercase tracking-wide u-b-text-saffron">Topic Quiz</span>
        </div>
        <h2 className="font-display text-3xl u-b-text-ivory mb-1">{topic.name}</h2>
        <p className="font-body text-sm u-b-text-ivory-60 mb-6">Choose a difficulty. Each quiz uses questions from this topic only, and previously used questions are remembered for this browsing session.</p>
        <div className="grid sm:grid-cols-3 gap-3">
          {["easy", "normal", "hard"].map((d) => (
            <button key={d} onClick={() => start(d)} className="rounded-lg border u-b-border-gold-30 u-b-bg-bg-panel p-5 text-left u-hover-border-gold-70 transition" style={{ borderTopLeftRadius: "1.25rem" }}>
              <h3 className="font-display text-lg u-b-text-ivory capitalize mb-1">{d}</h3>
              <p className="font-body text-xs u-b-text-ivory-55">{d === "easy" ? "No timer — learn at your own pace." : d === "normal" ? "20s per question · 3 lives" : "15s per question · 3 lives"}</p>
            </button>
          ))}
        </div>
      </div>
    );
  }

  if (done === "exhausted") {
    return (
      <div className="text-center py-8">
        <Trophy size={40} className="mx-auto u-b-text-gold-bright mb-4" />
        <h2 className="font-display text-3xl u-b-text-ivory mb-2">You've Seen Every Question</h2>
        <p className="font-body u-b-text-ivory-70 mb-6">There are no unused {diff} questions left for {topic.name} in this session. Choose another difficulty or keep studying the notes.</p>
        <div className="flex flex-wrap justify-center gap-3">
          <button onClick={chooseAgain} className="px-5 py-2.5 rounded-full font-body text-sm u-b-bg-saffron u-text-ink">Choose Another Difficulty</button>
          <button onClick={() => onNotes(topic.id)} className="px-5 py-2.5 rounded-full font-body text-sm border u-b-border-gold-40 u-b-text-ivory">Study Notes</button>
        </div>
      </div>
    );
  }

  if (done) {
    return (
      <div>
        <div className="text-center py-5">
          <Trophy size={40} className="mx-auto u-b-text-gold-bright mb-3" />
          <h2 className="font-display text-3xl u-b-text-ivory mb-2">Quiz Complete</h2>
          <p className="font-body u-b-text-ivory-70">You scored <strong>{score}</strong> out of {questions.length} on {diff} difficulty.</p>
        </div>
        <div className="mt-5 rounded-xl border u-b-border-gold-25 u-b-bg-bg-panel p-5">
          <h3 className="font-display text-xl u-b-text-gold-bright mb-4">Answer Review</h3>
          <p className="font-body text-xs u-b-text-ivory-55 mb-4">Correct answers are revealed here, after the quiz is finished.</p>
          <div className="space-y-4">
            {answers.map((item, n) => (
              <div key={item.q.id} className="border-b u-b-border-gold-15 pb-4 last:border-0">
                <p className="font-body text-sm u-b-text-ivory mb-2"><strong>{n + 1}. {item.q.q}</strong></p>
                <p className="font-body text-xs u-b-text-ivory-60">Your answer: <span className={item.selected === item.q.a ? "text-green-300" : "text-red-300"}>{item.selected >= 0 ? item.q.opts[item.selected] : "No answer (time expired)"}</span></p>
                <p className="font-body text-xs text-green-300 mt-1">Correct answer: {item.q.opts[item.q.a]}</p>
              </div>
            ))}
          </div>
        </div>
        <div className="flex flex-wrap justify-center gap-3 mt-6">
          <button onClick={chooseAgain} className="px-5 py-2.5 rounded-full font-body text-sm u-b-bg-saffron u-text-ink flex items-center gap-1.5"><RotateCcw size={14} /> Play Again</button>
          <button onClick={() => onNotes(topic.id)} className="px-5 py-2.5 rounded-full font-body text-sm border u-b-border-gold-40 u-b-text-ivory">Study Notes</button>
          <button onClick={onGames} className="px-5 py-2.5 rounded-full font-body text-sm border u-b-border-gold-40 u-b-text-ivory">Select Another Game</button>
          <button onClick={onHome} className="px-5 py-2.5 rounded-full font-body text-sm border u-b-border-gold-40 u-b-text-ivory">Go Back Home</button>
        </div>
      </div>
    );
  }

  const q = questions[i];
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <ProgressBar value={i} max={questions.length} />
      </div>
      <div className="flex items-center justify-between mb-5 font-body text-xs u-b-text-ivory-60">
        <span>Question {i + 1} / {questions.length} · Score {score}</span>
        <div className="flex items-center gap-3">
          {diff !== "easy" && <Lives count={lives} />}
          {limits[diff] > 0 && <span className="flex items-center gap-1"><Clock size={13} /> {timeLeft}s</span>}
        </div>
      </div>
      <h2 className="font-display text-xl sm:text-2xl u-b-text-ivory mb-6 leading-snug">{q.q}</h2>
      <div className="grid sm:grid-cols-2 gap-3">
        {q.opts.map((opt, idx) => (
          <button key={idx} disabled={picked !== null} onClick={() => handleAnswer(idx)}
            className="text-left px-4 py-3 rounded-lg font-body text-sm border transition u-b-border-gold-25 u-b-bg-bg-panel u-b-text-ivory-85 u-hover-border-gold-60">
            <span className="flex items-center justify-between">{opt}</span>
          </button>
        ))}
      </div>
      <p className="font-body text-xs u-b-text-ivory-40 mt-4">Answers and explanations are shown only after you finish the quiz.</p>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
function shuffle(arr) { return [...arr].map((v) => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map((v) => v[1]); }

function MatchGame({ sfx, unlock }) {
  const [cards, setCards] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState([]);
  const [moves, setMoves] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [started, setStarted] = useState(false);
  const [won, setWon] = useState(false);

  const setup = useCallback(() => {
    const deck = [];
    MATCH_PAIRS.forEach((p, idx) => {
      deck.push({ id: "i" + idx, pair: idx, text: p.item, type: "item" });
      deck.push({ id: "s" + idx, pair: idx, text: p.sig, type: "sig" });
    });
    setCards(shuffle(deck));
    setFlipped([]); setMatched([]); setMoves(0); setSeconds(0); setStarted(true); setWon(false);
  }, []);

  useEffect(() => {
    if (!started || won) return;
    const id = setInterval(() => setSeconds((s) => s + 1), 1000);
    return () => clearInterval(id);
  }, [started, won]);

  useEffect(() => {
    if (matched.length && matched.length === MATCH_PAIRS.length * 2 && !won) {
      setWon(true);
      sfx.win();
      unlock("cultureKeeper");
    }
  }, [matched, won, sfx, unlock]);

  function flip(card) {
    if (flipped.length === 2 || matched.includes(card.id) || flipped.find((c) => c.id === card.id)) return;
    sfx.click();
    const next = [...flipped, card];
    setFlipped(next);
    if (next.length === 2) {
      setMoves((m) => m + 1);
      const [a, b] = next;
      if (a.pair === b.pair) {
        setTimeout(() => { setMatched((m) => [...m, a.id, b.id]); setFlipped([]); sfx.correct(); }, 500);
      } else {
        setTimeout(() => { setFlipped([]); sfx.wrong(); }, 850);
      }
    }
  }

  if (!started) {
    return (
      <div>
        <h2 className="font-display text-3xl u-b-text-ivory mb-2">Indian Culture Match</h2>
        <p className="font-body text-sm u-b-text-ivory-60 mb-6">Flip two cards at a time to pair each tradition with its meaning. Fewer moves is better!</p>
        <button onClick={setup} className="px-6 py-3 rounded-full font-body text-sm u-b-bg-saffron u-text-ink">Start Game</button>
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-5 font-body text-xs u-b-text-ivory-60">
        <span>Moves: {moves}</span>
        <span className="flex items-center gap-1"><Clock size={13} /> {seconds}s</span>
      </div>
      {won ? (
        <div className="text-center py-8">
          <Sparkles size={36} className="mx-auto u-b-text-gold-bright mb-3" />
          <h3 className="font-display text-2xl u-b-text-ivory mb-2">All Matched!</h3>
          <p className="font-body text-sm u-b-text-ivory-70 mb-5">{moves} moves · {seconds}s</p>
          <button onClick={setup} className="px-5 py-2.5 rounded-full font-body text-sm u-b-bg-saffron u-text-ink inline-flex items-center gap-1.5"><RotateCcw size={14} /> Play Again</button>
        </div>
      ) : (
        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2.5">
          {cards.map((c) => {
            const isUp = matched.includes(c.id) || flipped.find((f) => f.id === c.id);
            return (
              <button key={c.id} onClick={() => flip(c)}
                className={`aspect-square rounded-lg border font-body text-xs sm:text-xs p-2 flex items-center justify-center text-center leading-tight transition-all ${
                  matched.includes(c.id) ? "border-green-400/60 bg-green-400/10 u-b-text-ivory-70" :
                  isUp ? "u-b-border-gold-70 u-b-bg-maroon-light-50 u-b-text-ivory" :
                  "u-b-border-gold-25 u-b-bg-bg-panel text-transparent"
                }`}>
                {isUp ? c.text : "?"}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  GAME 3 — FESTIVAL CHALLENGE                                           */
/* ---------------------------------------------------------------------- */
function FestivalGame({ sfx, unlock }) {
  const [started, setStarted] = useState(false);
  const [round, setRound] = useState(0);
  const [score, setScore] = useState(0);
  const [lives, setLives] = useState(3);
  const [picked, setPicked] = useState(null);
  const [timeLeft, setTimeLeft] = useState(15);
  const [done, setDone] = useState(false);
  const [order] = useState(() => shuffle(FESTIVALS));

  useEffect(() => {
    if (!started || done || picked !== null) return;
    setTimeLeft(15);
    const id = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) { clearInterval(id); answer(-1); return 0; }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [started, round, picked, done]);

  function begin() { setStarted(true); setRound(0); setScore(0); setLives(3); setDone(false); setPicked(null); sfx.click(); }

  function answer(opt) {
    if (picked !== null) return;
    const f = order[round];
    const correct = opt === f.correct;
    setPicked(opt);
    if (correct) { setScore((s) => s + 1); sfx.correct(); } else { sfx.wrong(); setLives((l) => l - 1); }
    setTimeout(() => {
      const nextScore = score + (correct ? 1 : 0);
      const outOfLives = !correct && lives - 1 <= 0;
      if (round + 1 >= order.length || outOfLives) {
        setDone(true);
        sfx.win();
        if (nextScore === order.length) unlock("festivalExpert");
      } else {
        setRound((r) => r + 1);
        setPicked(null);
      }
    }, 800);
  }

  if (!started) {
    return (
      <div>
        <h2 className="font-display text-3xl u-b-text-ivory mb-2">Festival Challenge</h2>
        <p className="font-body text-sm u-b-text-ivory-60 mb-6">You have 15 seconds and 3 lives to match each festival with its tradition.</p>
        <button onClick={begin} className="px-6 py-3 rounded-full font-body text-sm u-b-bg-saffron u-text-ink">Start Challenge</button>
      </div>
    );
  }

  if (done) {
    return (
      <div className="text-center py-8">
        <Flame size={38} className="mx-auto u-b-text-saffron mb-3" />
        <h2 className="font-display text-3xl u-b-text-ivory mb-2">Challenge Complete</h2>
        <p className="font-body u-b-text-ivory-70 mb-6">You scored {score} out of {order.length}.</p>
        <button onClick={begin} className="px-5 py-2.5 rounded-full font-body text-sm u-b-bg-saffron u-text-ink inline-flex items-center gap-1.5"><RotateCcw size={14} /> Play Again</button>
      </div>
    );
  }

  const f = order[round];
  return (
    <div>
      <div className="flex items-center justify-between mb-5 font-body text-xs u-b-text-ivory-60">
        <span>Round {round + 1} / {order.length} · Score {score}</span>
        <div className="flex items-center gap-3">
          <Lives count={lives} />
          <span className="flex items-center gap-1"><Clock size={13} /> {timeLeft}s</span>
        </div>
      </div>
      <h2 className="font-display text-2xl sm:text-3xl u-b-text-gold-bright mb-6">{f.name}</h2>
      <div className="grid sm:grid-cols-2 gap-3">
        {f.opts.map((opt, idx) => {
          const isCorrect = picked !== null && opt === f.correct;
          const isWrongPick = picked === opt && opt !== f.correct;
          return (
            <button key={idx} disabled={picked !== null} onClick={() => answer(opt)}
              className={`text-left px-4 py-3 rounded-lg font-body text-sm border transition ${
                isCorrect ? "border-green-400/70 bg-green-400/10 u-b-text-ivory" :
                isWrongPick ? "border-red-400/70 bg-red-400/10 u-b-text-ivory" :
                "u-b-border-gold-25 u-b-bg-bg-panel u-b-text-ivory-85 u-hover-border-gold-60"
              }`}>
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  GAME 4 — HISTORICAL TIMELINE                                          */
/* ---------------------------------------------------------------------- */
function TimelineGame({ sfx, unlock }) {
  const [unlocked, setUnlocked] = useState([TIMELINE[0].id]);
  const [selected, setSelected] = useState(TIMELINE[0].id);
  const [pending, setPending] = useState(null);
  const [feedback, setFeedback] = useState(null);

  useEffect(() => {
    if (unlocked.length === TIMELINE.length) unlock("historyMaster");
  }, [unlocked, unlock]);

  function tryUnlock(era) {
    setPending(era.id);
    setFeedback(null);
  }

  function answer(era, idx) {
    const correct = idx === era.unlockQ.a;
    setFeedback(correct ? "right" : "wrong");
    if (correct) {
      sfx.unlock();
      setTimeout(() => { setUnlocked((u) => [...u, era.id]); setSelected(era.id); setPending(null); setFeedback(null); }, 700);
    } else {
      sfx.wrong();
      setTimeout(() => setFeedback(null), 700);
    }
  }

  const activeEra = TIMELINE.find((e) => e.id === selected);

  return (
    <div>
      <h2 className="font-display text-3xl u-b-text-ivory mb-2">Historical Timeline</h2>
      <p className="font-body text-sm u-b-text-ivory-60 mb-6">Answer a quick question to unlock each next era.</p>
      <ProgressBar value={unlocked.length} max={TIMELINE.length} />
      <div className="mt-6 flex gap-2 overflow-x-auto pb-3">
        {TIMELINE.map((e, idx) => {
          const isUnlocked = unlocked.includes(e.id);
          const canTry = !isUnlocked && unlocked.includes(TIMELINE[idx - 1]?.id);
          return (
            <button key={e.id}
              onClick={() => (isUnlocked ? setSelected(e.id) : canTry ? tryUnlock(e) : null)}
              className={`shrink-0 px-4 py-3 rounded-lg font-body text-xs border text-left w-36 ${
                isUnlocked ? (selected === e.id ? "u-b-border-gold u-b-bg-maroon-light-50" : "u-b-border-gold-30 u-b-bg-bg-panel") :
                canTry ? "u-b-border-saffron-50 bg-black/20 u-b-text-saffron" : "border-white/10 bg-black/10 text-white/25"
              }`}>
              <span className="flex items-center gap-1.5">
                {!isUnlocked && <Lock size={11} />}
                {e.years}
              </span>
              <p className="mt-1 font-display text-sm leading-snug">{e.era}</p>
            </button>
          );
        })}
      </div>

      {pending && (() => {
        const era = TIMELINE.find((e) => e.id === pending);
        return (
          <div className="mt-6 rounded-lg border u-b-border-gold-30 u-b-bg-bg-panel p-5" style={{ borderTopLeftRadius: "1.25rem" }}>
            <p className="font-body text-xs u-b-text-saffron mb-2">Unlock: {era.era}</p>
            <h3 className="font-display text-lg u-b-text-ivory mb-4">{era.unlockQ.q}</h3>
            <div className="grid sm:grid-cols-2 gap-2.5">
              {era.unlockQ.opts.map((opt, idx) => (
                <button key={idx} onClick={() => answer(era, idx)}
                  className={`text-left px-4 py-2.5 rounded-lg font-body text-sm border transition ${
                    feedback && idx === era.unlockQ.a && feedback === "right" ? "border-green-400/70 bg-green-400/10" :
                    "u-b-border-gold-25 u-hover-border-gold-60"
                  }`}>
                  {opt}
                </button>
              ))}
            </div>
            {feedback === "wrong" && <p className="font-body text-xs text-red-400 mt-3">Not quite — try again.</p>}
          </div>
        );
      })()}

      {!pending && activeEra && (
        <div className="mt-6 rounded-lg border u-b-border-gold-25 u-b-bg-bg-panel p-5" style={{ borderTopLeftRadius: "1.25rem" }}>
          <p className="font-body text-xs u-b-text-saffron mb-1">{activeEra.years}</p>
          <h3 className="font-display text-xl u-b-text-ivory mb-2">{activeEra.era}</h3>
          <p className="font-body text-sm u-b-text-ivory-70 leading-relaxed">{activeEra.detail}</p>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  GAME 5 — CIVILIZATION EXPLORER (also reachable as "Interactive Map")  */
/* ---------------------------------------------------------------------- */
function MapExplorer({ sfx, unlock, visited, setVisited, embedded }) {
  const [selected, setSelected] = useState(null);

  function select(r) {
    setSelected(r.id);
    sfx.click();
    if (!visited.includes(r.id)) {
      const next = [...visited, r.id];
      setVisited(next);
      if (next.length === REGIONS.length) unlock("heritageHunter");
    }
  }

  const region = REGIONS.find((r) => r.id === selected);
  const fields = [
    ["History", region?.history], ["Languages", region?.languages], ["Clothing", region?.clothing],
    ["Food", region?.food], ["Dance & Music", region?.dance], ["Architecture", region?.architecture],
    ["Festivals", region?.festivals], ["Famous Sites", region?.sites],
  ];

  return (
    <div>
      {!embedded && (
        <>
          <SectionLabel>Interactive India Map</SectionLabel>
          <h1 className="font-display text-3xl sm:text-4xl u-b-text-ivory mb-2">Civilization Explorer</h1>
        </>
      )}
      <p className="font-body text-sm u-b-text-ivory-60 mb-2">Select a region to discover its history, culture, and landmarks.</p>
      <p className="font-body text-xs u-b-text-gold-70 mb-6">Explored {visited.length} / {REGIONS.length} regions</p>
      <div className="grid sm:grid-cols-3 gap-3 mb-6">
        {REGIONS.map((r) => (
          <button key={r.id} onClick={() => select(r)}
            className={`text-left px-4 py-4 rounded-lg font-body text-sm border transition-all btn-press flex items-center justify-between ${
              selected === r.id ? "u-b-border-gold u-b-bg-maroon-light-50 u-b-text-ivory" : "u-b-border-gold-25 u-b-bg-bg-panel u-b-text-ivory-80 u-hover-border-gold-60 card-hover"
            }`}>
            <span className="flex items-center gap-2"><MapPin size={14} className="u-b-text-saffron" /> {r.name}</span>
            {visited.includes(r.id) && <Check size={14} className="text-green-400" />}
          </button>
        ))}
      </div>

      {region && (
        <div key={region.id} className="rounded-lg border u-b-border-gold-30 u-b-bg-bg-panel p-5 sm:p-6 view-fade" style={{ borderTopLeftRadius: "1.5rem" }}>
          <h3 className="font-display text-2xl u-b-text-gold-bright mb-4">{region.name}</h3>
          <div className="grid sm:grid-cols-2 gap-4">
            {fields.map(([label, val]) => (
              <div key={label}>
                <p className="font-body text-xs u-b-text-saffron mb-0.5">{label}</p>
                <p className="font-body text-sm u-b-text-ivory-80 leading-relaxed">{val}</p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function HistoryVisual({ item }) {
  const [src, title, caption] = item;
  return (
    <figure className="rounded-xl overflow-hidden border u-b-border-gold-20 u-b-bg-bg-panel">
      <div className="relative h-44 sm:h-52 bg-black/20">
        <img src={src} alt={title} className="w-full h-full object-cover" loading="lazy"
          onError={(e) => {
            e.currentTarget.style.display = "none";
            const fallback = e.currentTarget.parentElement?.querySelector(".history-img-fallback");
            if (fallback) fallback.style.display = "flex";
          }} />
        <div className="history-img-fallback absolute inset-0 hidden items-center justify-center p-6 text-center"
          style={{ background: "radial-gradient(circle at 50% 35%, rgba(110,20,35,.75), rgba(21,10,12,.95))" }}>
          <div>
            <Landmark size={28} className="u-b-text-gold-bright mx-auto mb-2" />
            <p className="font-display text-lg u-b-text-ivory">{title}</p>
            <p className="font-body text-xs u-b-text-ivory-55 mt-1">Visual unavailable — use the caption and notes below.</p>
          </div>
        </div>
      </div>
      <figcaption className="px-4 py-3">
        <p className="font-display text-base u-b-text-gold-bright">{title}</p>
        <p className="font-body text-xs u-b-text-ivory-60 leading-relaxed mt-1">{caption}</p>
      </figcaption>
    </figure>
  );
}

function HistoryTimeline({ items }) {
  return (
    <div className="relative ml-2 sm:ml-4 pl-7 border-l u-b-border-gold-30 space-y-4">
      {items.map(([date, text], idx) => (
        <Reveal key={date + text} delay={idx * 0.03}>
          <div className="relative">
            <span className="absolute -left-[37px] top-1.5 w-3 h-3 rounded-full u-b-bg-saffron border-2 u-b-border-bg-deep timeline-dot" />
            <p className="font-body text-xs uppercase tracking-widest u-b-text-saffron">{date}</p>
            <p className="font-body text-sm sm:text-base leading-relaxed u-b-text-ivory-75 mt-1">{text}</p>
          </div>
        </Reveal>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  AI LEARNING ASSISTANT — "Ask Bharat" chat panel                       */
/*  Uses the published artifact's built-in "sample" capability to ask     */
/*  Claude on the viewer's own account — no API key, no backend server.   */
/*  This only works when the page is viewed as a published Claude         */
/*  artifact on claude.ai with that capability granted; elsewhere         */
/*  claude.use("sample") resolves null and the panel says so.             */
/* ---------------------------------------------------------------------- */
function ChatBot({ sfx, contextTopic = null }) {
  const [open, setOpen] = useState(false);
  const [hasOpened, setHasOpened] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem("bharat_openai_api_key") || ""; } catch (e) { return ""; } });
  const [showSettings, setShowSettings] = useState(false);
  const abortRef = useRef(null);
  const endRef = useRef(null);
  const taRef = useRef(null);

  useEffect(() => { try { localStorage.removeItem("bharat_claude_api_key"); } catch (e) {} }, []);

  useEffect(() => { if (open) endRef.current?.scrollIntoView({ behavior: "smooth", block: "end" }); }, [messages, loading, open]);
  useEffect(() => { if (!taRef.current) return; taRef.current.style.height = "auto"; taRef.current.style.height = Math.min(taRef.current.scrollHeight, 120) + "px"; }, [input]);
  useEffect(() => () => abortRef.current?.abort(), []);

  function toggle() { sfx.click(); setHasOpened(true); setOpen((o) => !o); }
  function saveKey() {
    try { if (apiKey.trim()) localStorage.setItem("bharat_openai_api_key", apiKey.trim()); else localStorage.removeItem("bharat_openai_api_key"); } catch (e) {}
    setApiKey(apiKey.trim()); setShowSettings(false); setErr(null); sfx.correct();
  }

  async function send(text) {
    const trimmed = text.trim();
    if (!trimmed || loading) return;
    const userMsg = { role: "user", content: trimmed };
    const history = [...messages, userMsg];
    setMessages(history); setInput(""); setErr(null); setLoading(true); sfx.pop();
    const controller = new AbortController(); abortRef.current = controller;
    try {
      let answer;
      if (apiKey.trim()) {
        answer = await askOpenAI(apiKey.trim(), history.slice(-20), contextTopic, controller.signal);
      } else {
        answer = localBharatAnswer(trimmed, contextTopic);
      }
      setMessages((m) => [...m, { role: "assistant", content: answer }]);
      sfx.pop();
    } catch (e) {
      if (e?.name === "AbortError") return;
      console.error("Ask Bharat request failed:", e);
      const fallback = localBharatAnswer(trimmed, contextTopic);
      setMessages((m) => [...m, { role: "assistant", content: fallback }]);
      setErr(apiKey ? "OpenAI could not answer this request, so I gave the built-in Bharat answer instead." : "For open-ended AI answers, add an OpenAI API key in ⚙ settings. Built-in history answers are still available.");
      sfx.wrong();
    } finally { setLoading(false); abortRef.current = null; }
  }

  function stop() { abortRef.current?.abort(); setLoading(false); }
  function onSubmit(e) { e.preventDefault(); send(input); }
  function onKeyDown(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }
  function clearChat() { sfx.click(); setMessages([]); setErr(null); }

  return (
    <>
      <button onClick={toggle} aria-label={open ? "Close chat" : "Ask a doubt"} className={`chatbot-fab u-b-bg-saffron u-text-ink btn-press ${!hasOpened ? "fab-pulse" : ""}`}>
        {open ? <X size={22} /> : <Bot size={24} />}
      </button>
      {hasOpened && (
        <div className={`chatbot-panel u-b-border-gold-40 ${open ? "chatbot-panel-open" : "chatbot-panel-closed"}`} style={{ background: "rgba(26,15,18,0.62)", backdropFilter: "blur(18px) saturate(140%)", WebkitBackdropFilter: "blur(18px) saturate(140%)", border: "1px solid" }} aria-hidden={!open}>
          <div className="flex items-center gap-2 px-4 py-3 border-b u-b-border-gold-25 shrink-0">
            <Bot size={17} className="u-b-text-gold-bright" />
            <div className="flex-1 min-w-0"><p className="font-display text-base u-b-text-ivory leading-tight">Ask Bharat</p><p className="font-body text-xs u-b-text-ivory-55 leading-tight">AI learning assistant</p></div>
            <button onClick={() => { sfx.click(); setShowSettings((v) => !v); }} aria-label="AI settings" title="AI settings" className="u-b-text-ivory-55 hover:opacity-80 font-body text-base">⚙</button>
            {messages.length > 0 && <button onClick={clearChat} aria-label="Clear chat" title="Clear chat" className="u-b-text-ivory-55 hover:opacity-80"><RotateCcw size={13} /></button>}
            <button onClick={toggle} aria-label="Close chat" className="u-b-text-ivory-55 hover:opacity-80"><X size={17} /></button>
          </div>

          {showSettings && <div className="px-4 py-3 border-b u-b-border-gold-25" style={{ background: "rgba(10,6,7,0.5)" }}>
            <p className="font-body text-xs u-b-text-ivory-80 mb-2"><b>Enable open-ended AI</b><br/>This standalone HTML connects directly to the OpenAI API. Your OpenAI key is stored only in this browser's local storage and sent directly to OpenAI. Do not use a key you cannot expose to a browser.</p>
            <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="Paste OpenAI API key" className="w-full px-3 py-2 rounded-lg bg-black/30 border u-b-border-gold-25 u-b-text-ivory text-xs mb-2 focus:outline-none" />
            <div className="flex gap-2"><button onClick={saveKey} className="px-3 py-1.5 rounded-lg u-b-bg-saffron u-text-ink font-body text-xs">Save key</button><button onClick={() => { setApiKey(""); try { localStorage.removeItem("bharat_openai_api_key"); } catch(e) {} }} className="px-3 py-1.5 rounded-lg border u-b-border-gold-25 u-b-text-ivory-75 font-body text-xs">Remove</button></div>
          </div>}

          <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
            {messages.length === 0 && <div>
              <p className="font-body text-sm u-b-text-ivory-70 leading-relaxed mb-3">{contextTopic ? <>You're exploring <span className="u-b-text-gold-bright">{contextTopic.name}</span>. Ask Bharat keeps this topic as context while answering your questions.</> : <>Namaste! 🙏 I’m Ask Bharat. Ask me anything about India, your current topic, or general questions.</>}</p>
              <div className="grid grid-cols-2 gap-2 mb-3">{(contextTopic ? [["Explain Simply", `Explain ${contextTopic.name} simply for a beginner.`],["Give Summary", `Give me a short complete summary of ${contextTopic.name}.`],["Give Exam Notes", `Give me exam-ready notes for ${contextTopic.name}.`],["Show Timeline", `Show me the important timeline of ${contextTopic.name}.`],["Quiz Me", `Quiz me on ${contextTopic.name}, one question at a time.`]] : STARTER_QUESTIONS.map((q) => [q,q])).map(([label,q]) => <button key={label} onClick={() => send(q)} className="text-left px-2.5 py-2 rounded-lg font-body text-[11px] border u-b-border-gold-25 u-b-text-ivory-75 hover:opacity-90 transition btn-press">{label}</button>)}</div>
              {!apiKey && <button onClick={() => setShowSettings(true)} className="font-body text-xs u-b-text-gold-bright underline">⚙ Add an OpenAI key for open-ended questions</button>}
            </div>}
            {messages.map((m, idx) => <div key={idx} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"} chat-bubble-in`}><div className="font-body text-sm leading-relaxed px-3 py-2 rounded-lg chat-bubble" style={m.role === "user" ? { background: "rgba(224,134,46,0.18)", border: "1px solid rgba(224,134,46,0.4)", color: "var(--ivory)", whiteSpace: "pre-wrap" } : { background: "rgba(38,20,24,0.55)", border: "1px solid rgba(201,162,77,0.25)", color: "var(--ivory)", whiteSpace: "pre-wrap" }}>{m.content}</div></div>)}
            {loading && <div className="flex justify-start"><div className="flex items-center gap-1 px-3 py-2.5 rounded-lg" style={{ background: "rgba(38,20,24,0.55)", border: "1px solid rgba(201,162,77,0.25)" }}>{[0,1,2].map((i) => <span key={i} className="typing-dot" style={{ animationDelay: `${i * 0.15}s`, width: 5, height: 5, borderRadius: "50%", background: "var(--gold-bright)", display: "inline-block" }} />)}</div></div>}
            {err && <p className="font-body text-xs text-red-300">{err}</p>}<div ref={endRef} />
          </div>
          <form onSubmit={onSubmit} className="flex items-end gap-2 px-3 py-3 border-t u-b-border-gold-25 shrink-0"><textarea ref={taRef} rows={1} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={onKeyDown} placeholder="Ask anything..." disabled={loading} className="flex-1 min-w-0 px-3 py-2 rounded-2xl font-body text-sm bg-black/25 border u-b-border-gold-25 u-b-text-ivory placeholder-white/30 focus:outline-none resize-none disabled:opacity-50" style={{ maxHeight: "120px" }} />{loading ? <button type="button" onClick={stop} aria-label="Stop" className="w-9 h-9 shrink-0 rounded-full flex items-center justify-center u-b-bg-saffron u-text-ink btn-press"><X size={15} /></button> : <button type="submit" disabled={!input.trim()} aria-label="Send" className="w-9 h-9 shrink-0 rounded-full flex items-center justify-center u-b-bg-saffron u-text-ink disabled:opacity-40 btn-press"><Send size={15} /></button>}</form>
        </div>
      )}
    </>
  );
}

/* ---------------------------------------------------------------------- */
/*  APP SHELL                                                             */
/* ---------------------------------------------------------------------- */
function App() {
  const [introDone, setIntroDone] = useState(false);
  const [view, setView] = useState("home");
  const [activeGame, setActiveGame] = useState(null);
  const [quizTopic, setQuizTopic] = useState("indus");
  const [selectedHistory, setSelectedHistory] = useState(null);
  const [soundOn, setSoundOn] = useState(true);
  const [visited, setVisited] = useState([]);
  const [achievements, setAchievements] = useState({
    ancientExplorer: false, historyMaster: false, cultureKeeper: false,
    heritageHunter: false, festivalExpert: false, bharatScholar: false,
  });
  const [toast, setToast] = useState(null);
  const prevAchRef = useRef(achievements);
  const sfx = useSfx(soundOn);

  const unlock = useCallback((id) => {
    setAchievements((prev) => {
      if (prev[id]) return prev;
      const next = { ...prev, [id]: true };
      const others = ["ancientExplorer", "historyMaster", "cultureKeeper", "heritageHunter", "festivalExpert"];
      if (others.every((k) => next[k]) && !next.bharatScholar) next.bharatScholar = true;
      return next;
    });
  }, []);

  useEffect(() => {
    const prev = prevAchRef.current;
    const newly = Object.keys(achievements).filter((k) => achievements[k] && !prev[k]);
    if (newly.length) {
      const pick = newly.includes("bharatScholar") ? "bharatScholar" : newly[0];
      const def = ACHIEVEMENTS_DEF.find((a) => a.id === pick);
      if (def) {
        setToast(def);
        const t = setTimeout(() => setToast(null), 3400);
        prevAchRef.current = achievements;
        return () => clearTimeout(t);
      }
    }
    prevAchRef.current = achievements;
  }, [achievements]);

  function go(v, gameId) {
    setView(v);
    setActiveGame(v === "games" ? gameId || null : null);
    if (v !== "history") setSelectedHistory(null);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const unlockedCount = Object.values(achievements).filter(Boolean).length;
  const gameProps = {
    sfx, unlock, visited, setVisited, quizTopic,
    onHome: () => go("home"),
    onGames: () => go("games"),
    onNotes: (id) => { setSelectedHistory(id); setView("history"); setActiveGame(null); window.scrollTo({ top: 0, behavior: "smooth" }); }
  };

  return (
    <div className="min-h-screen w-full" style={{ background: "var(--bg-deep)", color: "var(--ivory)" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&display=swap');
        :root {
          --bg-deep: #150a0c;
          --bg-panel: rgba(38, 20, 24, 0.55);
          --maroon: #6E1423;
          --maroon-light: #8C2233;
          --gold: #C9A24D;
          --gold-bright: #E8C873;
          --saffron: #E0862E;
          --teal: #146B72;
          --ivory: #F4E9D6;
        }
        .font-display { font-family: 'Rozha One', serif; }
        .font-body { font-family: 'Mukta', sans-serif; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; width: 100%; overflow-x: hidden; overflow-y: auto; }
        body { min-height: 100vh; touch-action: pan-y; }
        #root { min-height: 100vh; overflow: visible; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes intro-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes view-fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .view-fade { animation: view-fade-in 0.45s cubic-bezier(.2,.8,.2,1) both; }

        .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 16px 32px -16px rgba(0,0,0,0.55); }
        .btn-press { transition: transform 0.15s ease; }
        .btn-press:active { transform: scale(0.96); }

        @keyframes diya-float {
          0% { transform: translateY(0) scale(0.9); opacity: 0; }
          10% { opacity: 0.85; }
          90% { opacity: 0.6; }
          100% { transform: translateY(-180px) scale(1.1); opacity: 0; }
        }
        .diya-field { overflow: hidden; }
        .diya {
          position: absolute; bottom: -10px; width: 6px; height: 6px; border-radius: 50%;
          background: var(--gold-bright); box-shadow: 0 0 8px 2px rgba(232,200,115,0.7);
          animation-name: diya-float; animation-timing-function: ease-in; animation-iteration-count: infinite;
        }

        .ticker-mask {
          position: relative; overflow: hidden;
          mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
          -webkit-mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
        }
        @keyframes ticker-scroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }
        .ticker-track { animation: ticker-scroll 16s linear infinite; }
        .ticker-mask:hover .ticker-track { animation-play-state: paused; }

        @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,134,46,0.55); } 50% { box-shadow: 0 0 0 5px rgba(224,134,46,0); } }
        .timeline-dot { animation: pulse-dot 2.4s ease-in-out infinite; }

        @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,77,0); } 50% { box-shadow: 0 0 18px 1px rgba(201,162,77,0.25); } }
        .achievement-glow { animation: glow-pulse 3.2s ease-in-out infinite; }

        @keyframes toast-in { from { opacity: 0; transform: translateY(24px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
        .toast-pop { animation: toast-in 0.4s cubic-bezier(.2,.8,.2,1) both; }

        @media (prefers-reduced-motion: reduce) {
          .card-hover:hover { transform: none; }
          .diya, .timeline-dot, .achievement-glow, .ticker-track, [style*="spin-slow"] { animation: none !important; }
          .view-fade, .toast-pop { animation: none !important; }
        }
        ::selection { background: var(--saffron); color: #1a0d05; }
        .u-b-bg-bg-panel { background-color: var(--bg-panel); }
        .u-b-bg-maroon-light-30 { background-color: color-mix(in srgb, var(--maroon-light) 30%, transparent); }
        .u-b-bg-maroon-light-50 { background-color: color-mix(in srgb, var(--maroon-light) 50%, transparent); }
        .u-b-bg-maroon-light-60 { background-color: color-mix(in srgb, var(--maroon-light) 60%, transparent); }
        .u-b-bg-saffron { background-color: var(--saffron); }
        .u-b-bg-teal { background-color: var(--teal); }
        .u-b-border-bg-deep { border-color: var(--bg-deep); }
        .u-b-border-gold { border-color: var(--gold); }
        .u-b-border-gold-15 { border-color: color-mix(in srgb, var(--gold) 15%, transparent); }
        .u-b-border-gold-20 { border-color: color-mix(in srgb, var(--gold) 20%, transparent); }
        .u-b-border-gold-25 { border-color: color-mix(in srgb, var(--gold) 25%, transparent); }
        .u-b-border-gold-30 { border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
        .u-b-border-gold-40 { border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
        .u-b-border-gold-50 { border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
        .u-b-border-gold-60 { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
        .u-b-border-gold-70 { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
        .u-b-border-saffron-50 { border-color: color-mix(in srgb, var(--saffron) 50%, transparent); }
        .u-b-text-gold { color: var(--gold); }
        .u-b-text-gold-70 { color: color-mix(in srgb, var(--gold) 70%, transparent); }
        .u-b-text-gold-80 { color: color-mix(in srgb, var(--gold) 80%, transparent); }
        .u-b-text-gold-bright { color: var(--gold-bright); }
        .u-b-text-ivory { color: var(--ivory); }
        .u-b-text-ivory-40 { color: color-mix(in srgb, var(--ivory) 40%, transparent); }
        .u-b-text-ivory-55 { color: color-mix(in srgb, var(--ivory) 55%, transparent); }
        .u-b-text-ivory-60 { color: color-mix(in srgb, var(--ivory) 60%, transparent); }
        .u-b-text-ivory-65 { color: color-mix(in srgb, var(--ivory) 65%, transparent); }
        .u-b-text-ivory-70 { color: color-mix(in srgb, var(--ivory) 70%, transparent); }
        .u-b-text-ivory-75 { color: color-mix(in srgb, var(--ivory) 75%, transparent); }
        .u-b-text-ivory-80 { color: color-mix(in srgb, var(--ivory) 80%, transparent); }
        .u-b-text-ivory-85 { color: color-mix(in srgb, var(--ivory) 85%, transparent); }
        .u-b-text-saffron { color: var(--saffron); }
        .group:hover .u-gh-text-gold-bright { color: var(--gold-bright); }
        .u-hover-border-gold-60:hover { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
        .u-hover-border-gold-70:hover { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
        .u-hover-text-gold-bright:hover { color: var(--gold-bright); }
        .u-hover-text-ivory:hover { color: var(--ivory); }
        .u-text-ink { color: #1a0d05; }
        .u-tracking-wide-3 { letter-spacing: 0.3em; }
        .u-left-27 { left: -27px; }
        .u-maroon-gradient { background-image: linear-gradient(to bottom right, color-mix(in srgb, var(--maroon) 50%, transparent), transparent); }

        .chatbot-fab {
          position: fixed; right: 20px; bottom: 20px; z-index: 60;
          width: 56px; height: 56px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6);
        }
        @keyframes fab-pulse { 0% { box-shadow: 0 0 0 0 rgba(224,134,46,0.55); } 100% { box-shadow: 0 0 0 16px rgba(224,134,46,0); } }
        .fab-pulse { animation: fab-pulse 2.2s ease-out infinite; }

        .chatbot-panel {
          position: fixed; z-index: 59;
          left: 12px; right: 12px; bottom: 88px;
          height: min(70vh, 560px);
          border-radius: 20px;
          display: flex; flex-direction: column; overflow: hidden;
          box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7);
          transform-origin: bottom right;
          transition: opacity 0.32s cubic-bezier(.2,.8,.2,1), transform 0.32s cubic-bezier(.2,.8,.2,1);
        }
        @media (min-width: 640px) {
          .chatbot-panel { left: auto; right: 24px; width: 380px; bottom: 92px; height: 520px; }
        }
        .chatbot-panel-closed { opacity: 0; transform: translateY(16px) scale(0.96); pointer-events: none; }
        .chatbot-panel-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

        @keyframes chat-bubble-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .chat-bubble-in { animation: chat-bubble-in 0.3s ease both; }
        .chat-bubble { max-width: 85%; }
        .history-img-fallback { display: none; }
        .history-hero-fallback { display: none; }

        @keyframes bounce-dot { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
        .typing-dot { animation: bounce-dot 1.2s infinite ease-in-out; }

        @media (prefers-reduced-motion: reduce) {
          .fab-pulse, .chat-bubble-in, .typing-dot { animation: none !important; }
          .chatbot-panel { transition: opacity 0.2s ease !important; }
          .chatbot-panel-closed, .chatbot-panel-open { transform: none !important; }
        }
      `}</style>

      {!introDone && <Intro onDone={() => setIntroDone(true)} />}
      <Nav view={view} go={go} soundOn={soundOn} setSoundOn={setSoundOn} unlockedCount={unlockedCount} />

      <main key={view} className="view-fade">
        {view === "home" && <Home_ go={go} />}
        {view === "games" && <GamesHub active={activeGame} setActive={(id) => setActiveGame(id)} {...gameProps} />}
        {view === "history" && <HistoryPage selectedId={selectedHistory} onSelect={setSelectedHistory} onTakeQuiz={(id) => { setQuizTopic(id); setView("games"); setActiveGame("quiz"); window.scrollTo({ top: 0, behavior: "smooth" }); }} />}
        {view === "culture" && <CulturePage />}
        {view === "map" && (
          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10">
            <MapExplorer {...gameProps} />
          </div>
        )}
        {view === "achievements" && <AchievementsPage achievements={achievements} />}
        {view === "about" && <AboutPage />}
      </main>

      <footer className="border-t u-b-border-gold-15 mt-10 py-8 px-4 sm:px-6 text-center">
        <p className="font-body text-xs u-b-text-ivory-40">© 2026 BHARAT: Legends of India. All Rights Reserved.</p>
      </footer>

      {toast && (
        <div className="fixed bottom-6 left-1/2 z-50 toast-pop" style={{ transform: "translateX(-50%)" }}>
          <div className="flex items-center gap-3 px-4 py-3 rounded-full border u-b-border-gold-60 u-b-bg-maroon-light-60 shadow-lg shadow-black/40" style={{ backdropFilter: "blur(6px)" }}>
            <Trophy size={18} className="u-b-text-gold-bright shrink-0" />
            <div className="text-left">
              <p className="font-body text-xs uppercase tracking-wide u-b-text-gold-80 leading-none mb-0.5">Achievement Unlocked</p>
              <p className="font-display text-sm u-b-text-ivory leading-none">{toast.name}</p>
            </div>
          </div>
        </div>
      )}

      <ChatBot sfx={sfx} contextTopic={selectedHistory ? PERIODS.find((p) => p.id === selectedHistory) : null} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
